# Builds SpathaRE (x64 and ARM64, small exes that use the installed .NET 10
# Desktop Runtime) on every push and pull request.
# Download it from the run's "Artifacts" section.
# Releases: publishing a GitHub release builds and attaches both exes (one run;
# a separate tag trigger would race it). For a release that already exists, run this
# workflow by hand (Actions -> Build -> Run workflow) and enter its tag.
name: Build

on:
  push:
    branches: [main]
  release:
    types: [published]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Attach the exes to this existing release tag (e.g. 1.0.0); leave empty to just build'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # The release tag, if this run makes or updates a release.
      RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Tests
        run: dotnet run --project SpathaRE.Tests -c Release

      # Framework-dependent single file (settings in SpathaRE.csproj): a small exe that
      # needs the .NET 10 Desktop Runtime and offers to install it when it's missing.
      - name: Publish x64
        run: dotnet publish SpathaRE -c Release -r win-x64 -p:Platform=x64 -o out/x64

      - name: Publish ARM64
        run: dotnet publish SpathaRE -c Release -r win-arm64 -p:Platform=ARM64 -o out/arm64

      - name: Name the executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item out/x64/SpathaRE.exe dist/SpathaRE-x64.exe
          Copy-Item out/arm64/SpathaRE.exe dist/SpathaRE-arm64.exe
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: SpathaRE-x64
          path: dist/SpathaRE-x64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: SpathaRE-arm64
          path: dist/SpathaRE-arm64.exe

      - uses: softprops/action-gh-release@v2
        if: env.RELEASE_TAG != ''
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/SpathaRE-x64.exe
            dist/SpathaRE-arm64.exe
          generate_release_notes: true
